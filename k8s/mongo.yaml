apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service-mongo
  labels:
    app: execution-service-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-service-mongo
  template:
    metadata:
      labels:
        app: execution-service-mongo
    spec:
      containers:
      - name: mongo
        image: mongo:7
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service-mongo
spec:
  selector:
    app: execution-service-mongo
  ports:
  - port: 27017
    targetPort: 27017
